[project]
name = "coreweaving"
version = "0.1.0"
description = "A source-grounded Weave documentation agent with visible verification."
requires-python = ">=3.12"
dependencies = [
  "anthropic",
  "weave",
  "python-dotenv",
  "httpx",
  "rank-bm25",
  "streamlit",
  "pydantic>=2",
  "markdown-it-py>=3.0.0,<5.0.0",
]

[dependency-groups]
dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/coreweaving"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["sandbox: executes code inside Docker"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
